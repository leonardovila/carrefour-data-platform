[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carrefour_etl"
version = "0.1.0"
description = "Pipeline de ingesta del catalogo de Carrefour Argentina (Bronze layer hacia S3)"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.5",
    "requests>=2.31",
    "pyarrow>=14.0",
    "boto3>=1.34",
    "tzdata; platform_system=='Windows'",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "duckdb>=0.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["carrefour_etl*"]
